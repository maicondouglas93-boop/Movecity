# Fase 2 da auditoria de production readiness (H4, 2026-08-05): antes existiam DOIS
# workflows sobrepostos (ci.yml: backend + admin; test.yml: backend + frontend) e
# NENHUM deles rodava `npm run build` ÔÇö um erro que s├│ aparece no build de produ├º├úo
# (import quebrado, env faltando no bundle, chunk inv├ílido) passava direto e ia
# estourar na Vercel. Este arquivo unifica tudo e faz o build dos tr├¬s artefatos
# (web, driver e admin) ser condi├º├úo de merge. test.yml foi removido.
name: CI/CD Pipeline - MoveCity

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './Backend/package-lock.json'
      - run: npm ci
      - name: Contrato crítico de CSRF e logout
        run: npm run test:critical:csrf
      - name: Contrato crítico de privacidade do mapa
        run: npm run test:critical:map-privacy
      # Gate estável: Vitest unit (sem Jest legado / integração flaky).
      # Suíte Jest completa e e2e ficam fora do bloqueio até estabilizar.
      - name: Backend Vitest unit + coverage
        run: npm run test:coverage


  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - run: npm ci
      - name: Lint (n├úo bloqueante ÔÇö d├¡vida pr├®-existente de ~760 apontamentos)
        run: npm run lint
        continue-on-error: true
      - name: Testes unit├írios
        run: npx vitest run
      - name: Build web (gate)
        run: npm run build
      - name: Build driver (gate)
        run: npm run build:driver

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './admin-frontend/package-lock.json'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Testes unit├írios e de integra├º├úo
        run: npx vitest run
      - name: Build admin (gate)
        run: npm run build

  # Smoke E2E (páginas sobem). Fluxo completo de corrida/API fica fora do gate.
  e2e-frontend:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: ./frontend
        run: npx playwright install chromium --with-deps
      - name: Smoke E2E
        working-directory: ./frontend
        run: npx playwright test
        env:
          CI: true

  e2e-admin:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: [admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './admin-frontend/package-lock.json'
      - name: Install dependencies
        working-directory: ./admin-frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: ./admin-frontend
        run: npx playwright install chromium --with-deps
      - name: Smoke E2E
        working-directory: ./admin-frontend
        run: npx playwright test
        env:
          CI: true
