# Fase 2 da auditoria de production readiness (H4, 2026-08-05): antes existiam DOIS
# workflows sobrepostos (ci.yml: backend + admin; test.yml: backend + frontend) e
# NENHUM deles rodava `npm run build` ÔÇö um erro que s├│ aparece no build de produ├º├úo
# (import quebrado, env faltando no bundle, chunk inv├ílido) passava direto e ia
# estourar na Vercel. Este arquivo unifica tudo e faz o build dos tr├¬s artefatos
# (web, driver e admin) ser condi├º├úo de merge. test.yml foi removido.
name: CI/CD Pipeline - MoveCity

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './Backend/package-lock.json'
      - run: npm ci
      - name: Backend tests + coverage
        run: npm run test:coverage

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - run: npm ci
      - name: Lint (n├úo bloqueante ÔÇö d├¡vida pr├®-existente de ~760 apontamentos)
        run: npm run lint
        continue-on-error: true
      - name: Testes unit├írios
        run: npx vitest run
      - name: Build web (gate)
        run: npm run build
      - name: Build driver (gate)
        run: npm run build:driver

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './admin-frontend/package-lock.json'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Testes unit├írios e de integra├º├úo
        run: npx vitest run
      - name: Build admin (gate)
        run: npm run build

  # E2E ainda frágil (servidor/ambiente). Não bloqueia merge enquanto a suíte
  # não tiver webServer + backend estáveis no Actions. Builds unitários acima já são gate.
  e2e-frontend:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies (Backend)
        run: cd Backend && npm ci
      - name: Install dependencies (Frontend)
        run: cd frontend && npm ci
      - name: Install Playwright Browsers
        run: cd frontend && npx playwright install chromium --with-deps
      - name: Run Playwright tests
        run: cd frontend && npm run test:e2e
        env:
          NODE_ENV: test

  e2e-admin:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './admin-frontend/package-lock.json'
      - name: Install dependencies
        working-directory: ./admin-frontend
        run: npm ci
      - name: Install Playwright Browsers
        working-directory: ./admin-frontend
        run: npx playwright install --with-deps
      - name: Run Playwright E2E Tests
        working-directory: ./admin-frontend
        run: npx playwright test
