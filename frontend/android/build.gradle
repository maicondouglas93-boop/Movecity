// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // API 36 requer AGP 8.9.1 ou superior.
        classpath 'com.android.tools.build:gradle:8.9.1'
        // Plugin Google Services — lê google-services.json e injeta nos SDKs Firebase
        classpath 'com.google.gms:google-services:4.5.0'
        // Necessário com Firebase 34.x + AGP < 8.4 em apps Java-only (senão crash
        // PreferenceDataStoreDelegateKt no aparelho físico).
        // Alinhado ao stdlib do app e ao metadata Kotlin do Firebase BoM 34.x
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
